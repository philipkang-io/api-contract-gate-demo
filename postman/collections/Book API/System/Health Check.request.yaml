$kind: http-request
description: |-
  Checks whether the Book API is available and operating normally.

  A successful response returns HTTP 200 with a JSON object containing:

  - `status`: `ok`
      
  - `timestamp`: the current server time in ISO 8601 format
      

  Use this endpoint for service readiness checks and basic availability monitoring.
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Timestamp is ISO-8601', function () {
          const json = pm.response.json();
          pm.expect(json.timestamp).to.match(/^\d{4}-\d{2}-\d{2}T/);
      });
      pm.test('Response has status ok', function () {
          const json = pm.response.json();
          pm.expect(json.status).to.eql('ok');
          pm.expect(json.timestamp).to.be.a('string');
      });

      pm.test('Content-Type is JSON', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });
    language: text/javascript
order: 1000
