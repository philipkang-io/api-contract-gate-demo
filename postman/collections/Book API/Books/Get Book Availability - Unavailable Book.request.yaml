$kind: http-request
url: "{{baseUrl}}/api/v1/books/2/availability"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // Seed book "2" (1984) has every copy checked out, so it is the only way
      // to exercise the available=false branch without a checkout endpoint.
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Fully checked-out book is not available', function () {
          const json = pm.response.json();
          pm.expect(json.availability.bookId).to.eql('2');
          pm.expect(json.availability.available).to.eql(false);
          pm.expect(json.availability.copiesAvailable).to.eql(0);
          pm.expect(json.availability.copiesTotal).to.be.above(0);
      });
    language: text/javascript
order: 3600
